services:
  - type: web
    name: hardware-and-electricals
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        value: 9361866771
      - key: OTP_WEBHOOK_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: DATABASE_PATH
        value: /var/data/catalog.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: catalog-data
      mountPath: /var/data
      sizeGB: 1
