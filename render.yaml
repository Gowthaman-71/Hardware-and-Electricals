services:
  - type: web
    name: hardware-and-electricals
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.cjs
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        value: 9361866771
      - key: BUSINESS_WHATSAPP_NUMBER
        value: 919361866771
      - key: VITE_BUSINESS_WHATSAPP_NUMBER
        value: 919361866771
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: OWNER_WHATSAPP_NUMBER
        value: 919361866771
      - key: WHATSAPP_NEW_ORDER_TEMPLATE
        sync: false
      - key: WHATSAPP_ORDER_CONFIRMED_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://murugesan-electrical-and-hardwares.onrender.com
      - key: STORAGE_PROVIDER
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: RATE_LIMIT_STORE
        value: redis
      - key: REDIS_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
