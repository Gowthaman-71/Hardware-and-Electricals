services:
  - type: web
    name: hardware-and-electricals
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        value: 9361866771
      - key: OWNER_WHATSAPP_NUMBER
        value: +919361866771
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        value: MSGIND
      - key: MSG91_BASE_URL
        value: https://api.msg91.com/api/v5/whatsapp/send
      - key: DATABASE_PATH
        value: /var/data/catalog.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: catalog-data
      mountPath: /var/data
      sizeGB: 1
