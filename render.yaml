services:
  - type: web
    name: hardware-and-electricals
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        value: 9361866771
      - key: BUSINESS_WHATSAPP_NUMBER
        value: +919361866771
      - key: VITE_BUSINESS_WHATSAPP_NUMBER
        value: +919361866771
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_OWNER_NUMBER
        sync: false
      - key: WHATSAPP_NEW_ORDER_TEMPLATE
        sync: false
      - key: WHATSAPP_ORDER_CONFIRMED_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
