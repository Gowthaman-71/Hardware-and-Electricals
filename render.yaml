services:
  - type: web
    name: hardware-and-electricals
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        value: 9361866771
      - key: BUSINESS_WHATSAPP_NUMBER
        value: +919361866771
      - key: VITE_BUSINESS_WHATSAPP_NUMBER
        value: +919361866771
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
